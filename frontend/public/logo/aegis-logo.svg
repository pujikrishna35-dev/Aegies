<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8C5" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#86642A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="#071228" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 30 14 L 44 44 L 30 38 L 16 44 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="30" cy="30" r="3" fill="#FDFCFB" />
  </g>

  <!-- Typography -->
  <text x="80" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#071228" letter-spacing="1">
    AEGIS <tspan fill="#C5A059">OVERSEAS</tspan>
  </text>
  <text x="82" y="60" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#86642A" letter-spacing="3.5">
    EDUCATION SERVICES
  </text>
</svg>
